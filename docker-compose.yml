# PostgreSQL local pour Strapi (option B). L'option SQLite n'a besoin d'aucun service.
services:
  postgres:
    image: postgres:16-alpine
    container_name: lerevenu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-lerevenu}
      POSTGRES_USER: ${DATABASE_USERNAME:-lerevenu}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-lerevenu_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-lerevenu} -d ${DATABASE_NAME:-lerevenu}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
